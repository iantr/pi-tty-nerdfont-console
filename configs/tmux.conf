# ~/.tmux.conf
#
# The two lines that matter under kmscon: tmux otherwise tries to create a
# systemd cgroup scope for the session, which fails under a kmscon login and
# kills the session at birth. Also export TMUX_SYSTEMD=0 before launching
# (see bashrc-hook.sh).
set-option -g default-command bash
set-environment -gru DBUS_SESSION_BUS_ADDRESS

# --- quality of life, optional ---
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# NOTE: tmux reads its config ONCE at server start. Editing this file does not
# affect a running server. Reload live with:  tmux source-file ~/.tmux.conf
#
# --- getting around, if you're new to tmux ---
# Nearly every command starts with the PREFIX: hold Ctrl, press b, let go, then
# press one more key. Two steps, not a chord.
#
#   Ctrl+B then c    create a new window
#   Ctrl+B then n    next window
#   Ctrl+B then p    previous window
#   Ctrl+B then w    list windows and pick one
#   Ctrl+B then d    detach (everything keeps running)
#   Ctrl+B then ?    list every key binding
#
# Ctrl+C is NOT tmux - it's the normal Unix interrupt, and stops the program
# running in the current window. It won't close the window.
#
# Reattach with:  tmux attach -t main
