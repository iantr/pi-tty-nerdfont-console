# ~/.tmux.conf
#
# The two lines that matter under kmscon: tmux otherwise tries to create a
# systemd cgroup scope for the session, which fails under a kmscon login and
# kills the session at birth. Also export TMUX_SYSTEMD=0 before launching
# (see bashrc-hook.sh).
set-option -g default-command bash
set-environment -gru DBUS_SESSION_BUS_ADDRESS

# --- quality of life, optional ---
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# NOTE: tmux reads its config ONCE at server start. Editing this file does not
# affect a running server. Reload live with:  tmux source-file ~/.tmux.conf
