# /etc/kmscon/kmscon.conf
# font-engine=pango is the load-bearing line: it makes kmscon a TrueType
# renderer instead of a bitmap one. Without it your Nerd Font never renders.
font-name=CaskaydiaCove Nerd Font Mono
font-size=12
font-engine=pango
xkb-layout=us

# font-size is a taste setting tied to the physical panel, not a constant.
#   small panel (Pi Zero wall unit): 12
#   larger/sharper panel (Pi 4):     14
