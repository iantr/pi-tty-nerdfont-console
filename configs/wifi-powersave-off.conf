# /etc/NetworkManager/conf.d/wifi-powersave-off.conf
#
# WiFi power save makes console TYPING glitchy while bulk transfer stays fine:
# interactive SSH echoes every keystroke as its own round trip, so each
# character after a pause waits for the AP's next DTIM window (~300ms).
# Measured on a Pi Zero at -39 dBm: worst-case ping 1220ms ON vs 9.9ms OFF.
#
# Runtime fix (immediate, no reconnect):
#   sudo /usr/sbin/iw dev wlan0 set power_save off
# ...but NetworkManager re-applies its own value on every (re)connect, silently
# undoing it at the next reboot. Hence this file. Apply with:
#   nmcli general reload conf     (reloads WITHOUT dropping the link)
# Expect a brief blip anyway - up to ~45s unreachable, recovers on its own.
# Wait it out; do not re-probe in a loop.
#
# Cost: ~30-60 mW. Irrelevant on a mains-powered wall console.

[connection]
wifi.powersave = 2      # 2 = force OFF, 3 = force ON, 0 = default
