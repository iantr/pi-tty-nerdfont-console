# /etc/systemd/system/kmsconvt@tty1.service.d/resilience.conf
#
# kmscon v9.0.0 intermittently segfaults a second or two after start. It is not
# reliably reproducible and not tied to any config here - observed on an
# otherwise healthy Pi 4 across several boots (2026-08-23 x2, 2026-08-27 x2).
#
# The stock unit has NO Restart= and ships OnFailure=getty@%i.service, so a
# single crash hands tty1 to getty permanently: you get a plain-VT login prompt
# with a blinking cursor and the stock font, and nothing ever puts kmscon back.
# From across the room that is indistinguishable from "the Pi froze during boot".
#
# ☠️ Restart=on-failure is NOT sufficient. Observed race:
#   1. kmscon SEGVs                  -> OnFailure= starts getty@tty1
#   2. getty takes ownership of tty1
#   3. Restart= fires, kmscon finds the VT busy, logs
#      "destroying seat seat0 while still awake: -16" (EBUSY)
#      and exits with status 0/SUCCESS
#   4. status 0 is not a failure, so on-failure does NOT retry - and getty has
#      exited too (Conflicts=), so NOTHING owns tty1. Blinking cursor.
#
# Restart=always covers step 3: for a console daemon, exiting cleanly is still
# wrong - it should run forever. The burst limit stays generous so a genuinely
# broken kmscon eventually falls back to getty rather than looping invisibly
# (fail-safe: a usable local console beats a pretty one).
#
# Verify with a negative test - inject the real failure and watch it heal:
#   sudo kill -SEGV $(pgrep -f 'kmscon --vt=tty1')
#   # within ~6s: getty briefly takes tty1, then kmscon reclaims it with a NEW pid
#   systemctl is-active kmsconvt@tty1 getty@tty1     # active / inactive
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=always
RestartSec=3
