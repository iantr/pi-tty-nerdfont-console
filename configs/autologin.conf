# /etc/systemd/system/kmsconvt@tty1.service.d/autologin.conf
#
# The bare "ExecStart=" MUST come first - systemd needs it to clear the
# inherited value before you set a new one.
#
# Keep --gpus=all. --gpus=primary looks like the fix for the Pi 4's
# "driver does not support dumb buffers" error but matches ZERO GPUs on a Pi
# (primary == boot-VGA, a PCI concept; both Pi DRM nodes are platform devices).
# The real Pi 4 fix is the udev seat rule in 61-kmscon-v3d-offseat.rules.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon "--vt=%I" --seats=seat0 --no-switchvt --gpus=all --login -- /sbin/agetty --autologin pi --noclear - xterm-256color
